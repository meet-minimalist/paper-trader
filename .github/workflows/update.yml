name: update

# Runs the paper trade and republishes the page.
#
# The strategy code lives in a private repo and is checked out here into
# engine-src/, which .gitignore excludes. Nothing in this workflow ever
# runs `git add -A`; the publish step names the generated files
# explicitly, so private code cannot reach a public commit even if the
# ignore rule were dropped.
#
# TRIGGERS ARE DELIBERATELY LIMITED to schedule and manual dispatch.
# Never add pull_request, issue_comment or any other trigger an outsider
# can fire - that is what keeps PRIVATE_REPO_TOKEN out of reach.

on:
  schedule:
    # 11:00 UTC = 16:30 IST, an hour after the 15:30 NSE close
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      index:
        description: "Index to trade"
        type: choice
        required: false
        default: ""
        options:
          - ""
          - NIFTY_50
          - NIFTY_100
          - NIFTY_200
          - NIFTY_NEXT_50
          - NIFTY_MIDCAP_150
          - NIFTY_SMALLCAP_250
          - NIFTY_MIDSMALLCAP_400
          - NIFTY_TOTAL_MARKET
          - NIFTY_MICROCAP_250
          - NIFTY_LARGEMIDCAP_250
      start_date:
        description: "Start date, YYYY-MM-DD (forces a replay)"
        required: false
        default: ""
      start_cash:
        description: "Opening capital in INR (forces a replay)"
        required: false
        default: ""
      reset:
        description: "Discard state and replay from the start date"
        type: boolean
        default: false

concurrency:
  group: paper-trader
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out this (public) repo
        uses: actions/checkout@v7

      - name: Check out strategy code (private)
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.PRIVATE_REPO || 'meet-minimalist/trading-strategy-paper-trader' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: engine-src

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine-src/requirements.txt

      - run: pip install -r engine-src/requirements.txt

      - name: Advance the paper trade
        working-directory: engine-src
        # inputs go through env, not string interpolation, so a value can
        # never be spliced into the shell command
        env:
          IN_INDEX: ${{ inputs.index }}
          IN_START_DATE: ${{ inputs.start_date }}
          IN_START_CASH: ${{ inputs.start_cash }}
          IN_RESET: ${{ inputs.reset }}
        run: |
          args=(--public-dir "$GITHUB_WORKSPACE")
          reset=false
          if [ -n "$IN_INDEX" ]; then
            args+=(--index "$IN_INDEX")
          fi
          # start date and capital are baked into saved state, so changing
          # either only takes effect on a full replay
          if [ -n "$IN_START_DATE" ]; then
            args+=(--start-date "$IN_START_DATE"); reset=true
          fi
          if [ -n "$IN_START_CASH" ]; then
            args+=(--start-cash "$IN_START_CASH"); reset=true
          fi
          if [ "$IN_RESET" = "true" ]; then
            reset=true
          fi
          if [ "$reset" = "true" ]; then
            args+=(--reset)
          fi
          echo "runner args: ${args[*]}"
          python -m engine.runner "${args[@]}"

      - name: Render the page
        working-directory: engine-src
        run: python site/build.py --out "$GITHUB_WORKSPACE/index.html"

      - name: Save portfolio state back to the private repo
        working-directory: engine-src
        run: |
          git config user.name  "paper-trader bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --quiet --cached; then
            echo "no state change"
          else
            git commit -m "state: session $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Publish page and price cache
        run: |
          git config user.name  "paper-trader bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # pathspec-limited only - never a bare `git add -A`, which would
          # sweep in engine-src/ and publish the strategy. -A here applies
          # only within these paths, so it also picks up removals.
          git add -A -- index.html indices.json 'payload_*.json' data
          if git diff --quiet --cached; then
            echo "nothing to publish"
          else
            git commit -m "update: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Guard - private code must not be committed here
        run: |
          if git ls-files --error-unmatch engine-src >/dev/null 2>&1; then
            echo "::error::engine-src is tracked in the public repo"
            exit 1
          fi
          echo "clean: no private files tracked"

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp indices.json _site/
          cp payload_*.json _site/
          cp -r data _site/ 2>/dev/null || true
          touch _site/.nojekyll
          echo "staged: $(ls _site | tr '\n' ' ')"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
